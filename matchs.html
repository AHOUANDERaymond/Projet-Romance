<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mes Matchs - Cœurs Connectés</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #faf6f2;
            color: #2d1e1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 40px;
            flex: 1;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .animate {
            animation: fadeInUp 0.8s ease forwards;
        }

        /* ===== HEADER ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(44, 30, 26, 0.06);
            background: rgba(250, 246, 242, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            color: #c0392b;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            font-size: 26px;
        }

        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #5a4a44;
            font-size: 14px;
            font-weight: 450;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        nav a:hover,
        nav a.active {
            color: #c0392b;
        }

        nav a.active {
            font-weight: 600;
        }

        nav a .badge {
            background: #c0392b;
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 50px;
            margin-left: 4px;
        }

        .nav-profile {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s;
            border: 2px solid transparent;
        }

        .nav-profile:hover {
            transform: scale(1.05);
            border-color: #c0392b;
        }

        /* ===== BOUTON DÉCONNEXION ===== */
        .btn-logout {
            padding: 8px 20px;
            border: 1.5px solid #e74c3c;
            border-radius: 50px;
            background: transparent;
            color: #e74c3c;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .btn-logout:hover {
            background: #e74c3c;
            color: #fff;
        }

        /* ===== SECTION TITRE ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 32px 0 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            color: #1e130f;
        }

        .page-header h1 i {
            color: #c0392b;
            margin-right: 8px;
        }

        .page-header .subtitle {
            color: #7a6a64;
            font-size: 15px;
            margin-top: 4px;
        }

        .page-header .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 20px;
            border: 1.5px solid #e8e0da;
            border-radius: 50px;
            background: transparent;
            font-size: 13px;
            font-weight: 500;
            color: #5a4a44;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .filter-btn:hover {
            border-color: #c0392b;
            color: #c0392b;
        }

        .filter-btn.active {
            background: #c0392b;
            border-color: #c0392b;
            color: #fff;
            box-shadow: 0 4px 16px rgba(192, 57, 43, 0.2);
        }

        .filter-btn i {
            margin-right: 4px;
        }

        /* ===== STATS ===== */
        .match-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px 24px;
            border: 1px solid rgba(44, 30, 26, 0.04);
            box-shadow: 0 4px 16px rgba(44, 30, 26, 0.02);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-card .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .stat-card .stat-icon.rose { background: rgba(192, 57, 43, 0.10); color: #c0392b; }
        .stat-card .stat-icon.blue { background: rgba(52, 152, 219, 0.10); color: #3498db; }
        .stat-card .stat-icon.green { background: rgba(39, 174, 96, 0.10); color: #27ae60; }
        .stat-card .stat-icon.gold { background: rgba(241, 196, 15, 0.12); color: #f39c12; }

        .stat-card .stat-info .number {
            font-size: 22px;
            font-weight: 700;
            color: #1e130f;
        }

        .stat-card .stat-info .label {
            font-size: 13px;
            color: #7a6a64;
        }

        /* ===== GRILLE DES MATCHS ===== */
        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            padding-bottom: 40px;
        }

        .match-card {
            background: #ffffff;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(44, 30, 26, 0.04);
            border: 1px solid rgba(44, 30, 26, 0.03);
            transition: all 0.4s;
            animation: fadeInScale 0.6s ease forwards;
            opacity: 0;
            cursor: pointer;
            position: relative;
        }

        .match-card:nth-child(1) { animation-delay: 0.05s; }
        .match-card:nth-child(2) { animation-delay: 0.10s; }
        .match-card:nth-child(3) { animation-delay: 0.15s; }
        .match-card:nth-child(4) { animation-delay: 0.20s; }
        .match-card:nth-child(5) { animation-delay: 0.25s; }
        .match-card:nth-child(6) { animation-delay: 0.30s; }
        .match-card:nth-child(7) { animation-delay: 0.35s; }
        .match-card:nth-child(8) { animation-delay: 0.40s; }

        .match-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(44, 30, 26, 0.08);
        }

        .match-card .card-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: linear-gradient(135deg, #f0e8e0, #e6dcd4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #b0a49e;
            position: relative;
        }

        .match-card .card-image .online-status {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #27ae60;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.10);
        }

        .match-card .card-image .online-status.offline {
            background: #b0a49e;
        }

        .match-card .card-body {
            padding: 18px 20px 16px;
        }

        .match-card .card-body .name-age {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .match-card .card-body .name-age h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1e130f;
        }

        .match-card .card-body .name-age .age {
            font-size: 15px;
            color: #7a6a64;
            font-weight: 400;
        }

        .match-card .card-body .location {
            font-size: 13px;
            color: #9a8a84;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
        }

        .match-card .card-body .location i {
            font-size: 12px;
        }

        .match-card .card-body .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .match-card .card-body .tags span {
            padding: 4px 12px;
            background: #f5ede7;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 450;
            color: #5a4a44;
        }

        .match-card .card-body .match-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #f0e8e0;
        }

        .match-card .card-body .match-info .match-date {
            font-size: 12px;
            color: #b0a49e;
        }

        .match-card .card-body .match-info .match-date i {
            margin-right: 4px;
        }

        .match-card .card-body .match-info .btn-message {
            padding: 8px 16px;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .match-card .card-body .match-info .btn-message:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(192, 57, 43, 0.25);
        }

        .match-card .card-body .match-info .btn-message i {
            margin-right: 4px;
        }

        /* ===== BADGE "NOUVEAU MATCH" ===== */
        .match-card .new-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #c0392b;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 50px;
            box-shadow: 0 4px 12px rgba(192, 57, 43, 0.3);
            animation: pulse 2s ease-in-out infinite;
            z-index: 2;
        }

        /* ===== ÉTAT VIDE ===== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            grid-column: 1 / -1;
        }

        .empty-state .empty-icon {
            font-size: 72px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty-state h3 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #1e130f;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #7a6a64;
            font-size: 16px;
            max-width: 400px;
            margin: 0 auto 24px;
        }

        .empty-state .btn-primary {
            padding: 12px 36px;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 8px 24px rgba(192, 57, 43, 0.2);
            font-family: 'Inter', sans-serif;
        }

        .empty-state .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(192, 57, 43, 0.3);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1e130f;
            color: #fff;
            padding: 16px 28px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 200;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            color: #2ecc71;
            font-size: 20px;
        }

        .toast .toast-close {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            font-size: 18px;
            margin-left: 8px;
            transition: color 0.3s;
        }

        .toast .toast-close:hover {
            color: #fff;
        }

        /* ===== FOOTER ===== */
        footer {
            padding: 24px 0;
            border-top: 1px solid rgba(44, 30, 26, 0.05);
            text-align: center;
            font-size: 13px;
            color: #7a6a64;
        }

        footer a {
            color: #7a6a64;
            text-decoration: none;
            margin: 0 12px;
            transition: color 0.3s;
        }

        footer a:hover {
            color: #c0392b;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .match-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container { padding: 0 20px; }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .match-stats {
                grid-template-columns: 1fr 1fr;
            }

            .stat-card {
                padding: 14px 18px;
            }

            .stat-card .stat-info .number {
                font-size: 18px;
            }

            .match-grid {
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }

            .match-card .card-image {
                height: 160px;
            }

            nav a span {
                display: none;
            }

            nav a .badge {
                display: none;
            }

            .filter-btn span {
                display: none;
            }

            .filter-btn i {
                margin-right: 0;
            }
        }

        @media (max-width: 480px) {
            .match-grid {
                grid-template-columns: 1fr;
            }

            .match-stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 12px 14px;
            }

            .stat-card .stat-icon {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }

            .stat-card .stat-info .number {
                font-size: 16px;
            }

            .match-card .card-image {
                height: 200px;
            }

            .page-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header>
            <a href="INDEX.HTML" class="logo">
                <span>❤️</span> Cœurs Connectés
            </a>
            <nav>
                <a href="dashboard.html"><i class="fas fa-compass"></i> <span>Découvrir</span></a>
                <a href="matchs.html" class="active"><i class="fas fa-heart"></i> <span>Matchs</span> <span class="badge" id="matchBadge">0</span></a>
                <a href="messages.html"><i class="fas fa-comment-dots"></i> <span>Messages</span> <span class="badge" id="messageBadge">0</span></a>
                <a href="profil.html"><i class="fas fa-user"></i> <span>Profil</span></a>
                <div class="nav-profile" onclick="window.location.href='profil.html'" title="Mon profil" id="profileInitial">JD</div>
            </nav>
        </header>

        <!-- ===== PAGE HEADER ===== -->
        <div class="page-header">
            <div>
                <h1><i class="fas fa-heart"></i> Mes Matchs</h1>
                <div class="subtitle" id="subtitle">❤️ Chargement des matchs...</div>
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all"><i class="fas fa-th"></i> <span>Tous</span></button>
                <button class="filter-btn" data-filter="recent"><i class="fas fa-clock"></i> <span>Récents</span></button>
                <button class="filter-btn" data-filter="online"><i class="fas fa-circle"></i> <span>En ligne</span></button>
                <button class="filter-btn" data-filter="nearby"><i class="fas fa-map-pin"></i> <span>Près de moi</span></button>
            </div>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </button>
        </div>

        <!-- ===== STATS ===== -->
        <div class="match-stats">
            <div class="stat-card">
                <div class="stat-icon rose"><i class="fas fa-heart"></i></div>
                <div class="stat-info">
                    <div class="number" id="statMatchs">0</div>
                    <div class="label">Matchs</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fas fa-comment"></i></div>
                <div class="stat-info">
                    <div class="number" id="statConversations">0</div>
                    <div class="label">Conversations</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fas fa-circle"></i></div>
                <div class="stat-info">
                    <div class="number" id="statEnLigne">0</div>
                    <div class="label">En ligne</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon gold"><i class="fas fa-star"></i></div>
                <div class="stat-info">
                    <div class="number" id="statNouveaux">0</div>
                    <div class="label">Nouveaux</div>
                </div>
            </div>
        </div>

        <!-- ===== GRILLE DES MATCHS ===== -->
        <div class="match-grid" id="matchGrid">
            <!-- Les matchs seront chargés dynamiquement -->
        </div>

        <!-- ===== FOOTER ===== -->
        <footer>
            <span>© 2026 Cœurs Connectés — avec ❤️</span>
            <span>
                <a href="#">Mentions légales</a>
                <a href="#">Confidentialité</a>
                <a href="#">Contact</a>
            </span>
        </footer>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <i class="fas fa-heart"></i>
        <span id="toastMessage">💬 Conversation démarrée</span>
        <button class="toast-close" onclick="closeToast()">✕</button>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ===== CONFIGURATION =====
        const API_URL = window.location.origin + '/api';
        let allMatchs = [];
        let currentFilter = 'all';

        // ===== AUTHENTIFICATION =====
        async function checkAuth() {
            try {
                const response = await fetch(`${API_URL}/me`, {
                    credentials: 'include'
                });
                const data = await response.json();
                if (!data.success) {
                    window.location.href = 'CONNEXION.HTML';
                } else {
                    document.getElementById('profileInitial').textContent = (data.user.prenom || 'U').charAt(0).toUpperCase();
                    loadMatchs();
                    loadStats();
                }
            } catch (error) {
                console.error('Erreur auth:', error);
                window.location.href = 'CONNEXION.HTML';
            }
        }

        // ===== DÉCONNEXION =====
        async function logout() {
            try {
                await fetch(`${API_URL}/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
                window.location.href = 'CONNEXION.HTML';
            } catch (error) {
                console.error('Erreur déconnexion:', error);
                alert('Erreur lors de la déconnexion');
            }
        }

        // ===== CHARGER LES STATISTIQUES =====
        async function loadStats() {
            try {
                // Matchs
                const matchResponse = await fetch(`${API_URL}/matchs`, { credentials: 'include' });
                const matchData = await matchResponse.json();
                if (matchData.success) {
                    const matchCount = matchData.matchs ? matchData.matchs.length : 0;
                    document.getElementById('statMatchs').textContent = matchCount;
                    document.getElementById('matchBadge').textContent = matchCount;
                }

                // Messages non lus
                const notifResponse = await fetch(`${API_URL}/notifications`, { credentials: 'include' });
                const notifData = await notifResponse.json();
                if (notifData.success) {
                    const unreadCount = notifData.notifications ? notifData.notifications.filter(n => !n.lue).length : 0;
                    document.getElementById('messageBadge').textContent = unreadCount;
                }
            } catch (error) {
                console.error('Erreur chargement stats:', error);
            }
        }

        // ===== CHARGER LES MATCHS =====
        async function loadMatchs() {
            try {
                const response = await fetch(`${API_URL}/matchs`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success && data.matchs && data.matchs.length > 0) {
                    allMatchs = data.matchs;
                    document.getElementById('subtitle').textContent = `❤️ ${allMatchs.length} cœurs qui battent à l'unisson`;
                    renderMatchs(allMatchs);
                    updateStats(allMatchs);
                } else {
                    document.getElementById('subtitle').textContent = '💔 Aucun match pour le moment';
                    document.getElementById('matchGrid').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">💔</div>
                            <h3>Pas encore de matchs</h3>
                            <p>Continuez à swiper pour trouver des personnes qui vous correspondent !</p>
                            <button class="btn-primary" onclick="window.location.href='dashboard.html'">
                                <i class="fas fa-compass"></i> Découvrir
                            </button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Erreur chargement matchs:', error);
            }
        }

        // ===== METTRE À JOUR LES STATISTIQUES =====
        function updateStats(matchs) {
            const onlineCount = matchs.filter(m => m.statut === 'en_ligne').length;
            const recentCount = matchs.filter(m => {
                const date = new Date(m.date_match);
                const now = new Date();
                const diff = (now - date) / (1000 * 60 * 60 * 24);
                return diff <= 2;
            }).length;
            
            document.getElementById('statConversations').textContent = matchs.length;
            document.getElementById('statEnLigne').textContent = onlineCount;
            document.getElementById('statNouveaux').textContent = recentCount;
        }

        // ===== AFFICHER LES MATCHS =====
        function renderMatchs(matchs) {
            const grid = document.getElementById('matchGrid');
            grid.innerHTML = '';

            if (matchs.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💔</div>
                        <h3>Aucun match trouvé</h3>
                        <p>Essayez de modifier vos filtres pour voir plus de résultats.</p>
                    </div>
                `;
                return;
            }

            const emojis = ['👩', '👨', '👩‍🦰', '👨‍🦰', '👩‍🦱', '👨‍🦱', '👩‍🦳', '👨‍🦳'];
            const today = new Date();

            matchs.forEach((match, index) => {
                const isOnline = match.statut === 'en_ligne';
                const date = new Date(match.date_match);
                const diffDays = Math.floor((today - date) / (1000 * 60 * 60 * 24));
                
                let dateText = 'Match aujourd\'hui';
                if (diffDays === 1) dateText = 'Match hier';
                else if (diffDays > 1) dateText = `Match il y a ${diffDays} jours`;
                
                const isNew = diffDays <= 1;
                const emoji = emojis[Math.floor(Math.random() * emojis.length)];

                const card = document.createElement('div');
                card.className = 'match-card';
                card.dataset.status = match.statut;
                card.dataset.date = match.date_match;
                card.dataset.distance = Math.floor(Math.random() * 20) + 1;
                card.dataset.matchId = match.id;
                card.dataset.autreId = match.autre_id;
                card.dataset.prenom = match.prenom;
                card.style.animationDelay = `${(index % 8) * 0.05}s`;

                card.innerHTML = `
                    ${isNew ? '<span class="new-badge">✨ Nouveau match</span>' : ''}
                    <div class="card-image" style="background: linear-gradient(135deg, #f0e8e0, #e6dcd4);">
                        ${emoji}
                        <span class="online-status ${isOnline ? '' : 'offline'}"></span>
                    </div>
                    <div class="card-body">
                        <div class="name-age">
                            <h3>${match.prenom}</h3>
                            <span class="age">${match.age || '?'} ans</span>
                        </div>
                        <div class="location"><i class="fas fa-map-pin"></i> ${match.ville || 'France'}, ${Math.floor(Math.random() * 20) + 1} km</div>
                        <div class="tags">
                            <span>❤️ Matché</span>
                            <span>💬 En attente</span>
                        </div>
                        <div class="match-info">
                            <span class="match-date"><i class="far fa-clock"></i> ${dateText}</span>
                            <button class="btn-message" onclick="event.stopPropagation(); openChat('${match.prenom}', ${match.id}, ${match.autre_id})">
                                <i class="fas fa-comment"></i> Discuter
                            </button>
                        </div>
                    </div>
                `;

                // Ouvrir la conversation au clic sur la carte
                card.addEventListener('click', function() {
                    openChat(match.prenom, match.id, match.autre_id);
                });

                grid.appendChild(card);
            });
        }

        // ===== FILTRES =====
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                applyFilter();
            });
        });

        function applyFilter() {
            let filtered = allMatchs;

            if (currentFilter === 'recent') {
                const now = new Date();
                filtered = allMatchs.filter(m => {
                    const date = new Date(m.date_match);
                    const diff = (now - date) / (1000 * 60 * 60 * 24);
                    return diff <= 2;
                });
            } else if (currentFilter === 'online') {
                filtered = allMatchs.filter(m => m.statut === 'en_ligne');
            } else if (currentFilter === 'nearby') {
                // Simulation de proximité - on garde aléatoirement certains matchs
                filtered = allMatchs.filter(() => Math.random() > 0.4);
            }

            renderMatchs(filtered);
        }

        // ===== OUVRIR UN CHAT =====
        function openChat(name, matchId, autreId) {
            const toast = document.getElementById('toast');
            const message = document.getElementById('toastMessage');
            message.textContent = `💬 Conversation démarrée avec ${name}`;
            toast.classList.add('show');

            // Rediriger vers la page des messages avec le match sélectionné
            setTimeout(() => {
                window.location.href = `messages.html?match=${matchId}`;
            }, 1500);

            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        function closeToast() {
            document.getElementById('toast').classList.remove('show');
            clearTimeout(window.toastTimeout);
        }

        // ===== TOUCHE ÉCHAP =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeToast();
            }
        });

        // ===== INITIALISATION =====
        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>

</body>
</html>
